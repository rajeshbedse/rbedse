name: Daily NSE Scan

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
  schedule:
    # 20:30 IST (15:00 UTC), Monday-Friday
    - cron: "0 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-nse-scan
  cancel-in-progress: false

jobs:
  generate-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements-pipeline.txt

      - name: Install Chromium and virtual display
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Determine run date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.run_date }}" ]; then
            echo "run_date=${{ inputs.run_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run NSE pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a python -m nse_pipeline.pipeline --date "${{ steps.date.outputs.run_date }}"

      - name: Validate generated snapshot
        run: |
          python -m nse_pipeline.validate_output --date "${{ steps.date.outputs.run_date }}"

      - name: Publish daily snapshot to Git
        env:
          RUN_DATE: ${{ steps.date.outputs.run_date }}
        run: |
          STATUS=$(python -c "import json; print(json.load(open('output/${RUN_DATE}/meta.json', encoding='utf-8-sig')).get('status', 'unknown'))")

          echo "Snapshot status: ${STATUS}"

          if [ "${STATUS}" != "success" ]; then
            echo "Snapshot is not publishable (${STATUS}). Nothing will be committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "output/${RUN_DATE}/"

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "Daily NSE scan: ${RUN_DATE}"
          git push
