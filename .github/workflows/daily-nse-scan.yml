name: Daily NSE Scan

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
  schedule:
    - cron: "0 */2 * * 1-6"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: daily-nse-scan
  cancel-in-progress: false

jobs:
  generate-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements-pipeline.txt

      - name: Install Chromium and virtual display
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Determine run date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.run_date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "run_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "run_date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run NSE pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python -m nse_pipeline.pipeline --date "${{ steps.date.outputs.run_date }}"

      - name: Validate generated snapshot
        run: |
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          ls -lah "output/${RUN_DATE}/"
          python -m nse_pipeline.validate_output --date "${RUN_DATE}"
          test -s "output/${RUN_DATE}/ryb_scan.csv"
          python - <<'PY'
          import csv, json, os
          run_date = os.environ["RUN_DATE"]
          base = os.path.join("output", run_date)
          with open(os.path.join(base, "meta.json"), encoding="utf-8-sig") as f:
              meta = json.load(f)
          with open(os.path.join(base, "ryb_scan.csv"), encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          expected = int(meta.get("shortlisted", -1))
          if expected <= 0 or len(rows) != expected:
              raise SystemExit(f"RYB canonical scan mismatch: meta shortlisted={expected}, ryb_scan rows={len(rows)}")
          symbols = [r.get("Symbol", "").strip().upper() for r in rows]
          if not all(symbols) or len(symbols) != len(set(symbols)):
              raise SystemExit("RYB canonical scan contains blank or duplicate symbols")
          print(f"RYB canonical scan validated: {len(rows)} final shortlisted symbols")
          PY
        env:
          RUN_DATE: ${{ steps.date.outputs.run_date }}

      - name: Publish research data to RYB
        env:
          RUN_DATE: ${{ steps.date.outputs.run_date }}
          RYB_REPO_TOKEN: ${{ secrets.RYB_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "${RYB_REPO_TOKEN}" ]; then
            echo "RYB_REPO_TOKEN is not configured; skipping RYB publish."
            exit 0
          fi
          STATUS=$(python -c "import json; print(json.load(open('output/${RUN_DATE}/meta.json', encoding='utf-8-sig')).get('status', 'unknown'))")
          if [ "${STATUS}" != "success" ]; then
            echo "Snapshot is not publishable (${STATUS}); skipping RYB publish."
            exit 0
          fi
          rm -rf /tmp/RYB /tmp/RYB_HISTORY_BACKUP
          git clone --depth 1 "https://x-access-token:${RYB_REPO_TOKEN}@github.com/rajeshbedse/RYB.git" /tmp/RYB
          cd /tmp/RYB

          # Preserve the last known-good historical chart data before the
          # current snapshot is rebuilt. A transient NSE/Yahoo history outage
          # must never replace populated price/cost history with empty arrays.
          if [ -d data/history ]; then
            cp -a data/history /tmp/RYB_HISTORY_BACKUP
          fi

          # Regulation 31 is an enrichment stage, not part of the core NSE scan.
          # Existing reference rows are migrated to PledgeDataDate=2026-06-30;
          # only genuinely new symbols are opened in NSE. Capture failures never
          # overwrite a last-known-good row and do not fail the core scan.
          set +e
          xvfb-run -a python scripts/capture_regulation31.py \
            --universe "${GITHUB_WORKSPACE}/output/${RUN_DATE}/enriched_full.csv" \
            --reference data/reference/regulation31_pledge.csv
          REG31_STATUS=$?
          set -e
          echo "Regulation 31 enrichment exit code: ${REG31_STATUS}"

          python scripts/build_snapshot.py "${GITHUB_WORKSPACE}/output/${RUN_DATE}"

          # Merge historical chart series with the previous published snapshot.
          # Current rows win for duplicate dates; previous rows fill gaps. This
          # handles both a total outage (new series empty) and a partial outage
          # without discarding valid historical research data.
          python - <<'PY'
          import json
          from pathlib import Path

          current_root = Path("data/history")
          previous_root = Path("/tmp/RYB_HISTORY_BACKUP")
          if not previous_root.exists():
              print("No previous RYB history backup available; keeping generated history.")
              raise SystemExit(0)

          def merge_by_date(previous, current):
              merged = {}
              for row in previous or []:
                  if isinstance(row, dict) and row.get("date"):
                      merged[str(row["date"])] = row
              for row in current or []:
                  if isinstance(row, dict) and row.get("date"):
                      merged[str(row["date"])] = row
              return [merged[key] for key in sorted(merged)]

          merged_symbols = 0
          restored_price = 0
          restored_cost = 0
          for current_file in current_root.glob("*.json"):
              previous_file = previous_root / current_file.name
              if not previous_file.exists():
                  continue
              try:
                  current = json.loads(current_file.read_text(encoding="utf-8"))
                  previous = json.loads(previous_file.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              current_history = current.get("history") or {}
              previous_history = previous.get("history") or {}
              old_price = previous_history.get("price") or []
              old_cost = previous_history.get("promoter_cost") or []
              new_price = current_history.get("price") or []
              new_cost = current_history.get("promoter_cost") or []
              merged_price = merge_by_date(old_price, new_price)
              merged_cost = merge_by_date(old_cost, new_cost)
              if len(merged_price) > len(new_price):
                  restored_price += 1
              if len(merged_cost) > len(new_cost):
                  restored_cost += 1
              if merged_price != new_price or merged_cost != new_cost:
                  current_history["price"] = merged_price
                  current_history["promoter_cost"] = merged_cost
                  current["history"] = current_history
                  current_file.write_text(json.dumps(current, separators=(",", ":"), ensure_ascii=False), encoding="utf-8")
                  merged_symbols += 1

          print(f"Historical series protected: {merged_symbols} symbols; price restored/filled for {restored_price}, promoter cost for {restored_cost}.")
          PY

          python scripts/augment_risk.py "${GITHUB_WORKSPACE}/output/${RUN_DATE}" data
          python scripts/validate_snapshot.py
          test -s data/snapshot.json
          test -d data/stocks
          test -d data/history
          CORE_COUNT=$(find data/stocks -maxdepth 1 -name '*.json' | wc -l)
          HISTORY_COUNT=$(find data/history -maxdepth 1 -name '*.json' | wc -l)
          test "${CORE_COUNT}" -gt 0
          test "${CORE_COUNT}" -eq "${HISTORY_COUNT}"
          test ! -e data/stock_details.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "RYB research data is unchanged."
            exit 0
          fi
          git commit -m "Publish research data: ${RUN_DATE}"
          git push origin HEAD:main

      - name: Publish daily snapshot to main only
        env:
          RUN_DATE: ${{ steps.date.outputs.run_date }}
        run: |
          STATUS=$(python -c "import json; print(json.load(open('output/${RUN_DATE}/meta.json', encoding='utf-8-sig')).get('status', 'unknown'))")
          echo "Snapshot status: ${STATUS}"
          if [ "${STATUS}" != "success" ]; then
            echo "Snapshot is not publishable (${STATUS}). Nothing will be committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/${RUN_DATE}/"
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Daily NSE scan: ${RUN_DATE}"
          git push origin HEAD:main
