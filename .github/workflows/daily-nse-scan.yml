name: Daily NSE Scan

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
  schedule:
    # 20:30 IST, Monday-Saturday — generate today's report
    - cron: "30 20 * * 1-6"
      timezone: "Asia/Kolkata"
    # 08:00 IST, Tuesday-Saturday — refresh previous day's report
    - cron: "0 8 * * 2-6"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: daily-nse-scan
  cancel-in-progress: false

jobs:
  generate-data:
    # Production pipeline is allowed to execute only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements-pipeline.txt

      - name: Install Chromium and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m playwright install chromium

      - name: Determine run date
        id: date
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_DATE: ${{ inputs.run_date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "run_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
            echo "Run mode: manual"
            echo "Report date: $INPUT_DATE"
          elif [ "$SCHEDULE" = "0 8 * * 2-6" ]; then
            echo "run_date=$(TZ=Asia/Kolkata date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
            echo "Run mode: morning refresh"
            echo "Report date: previous IST day"
          else
            echo "run_date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
            echo "Run mode: evening scan"
            echo "Report date: current IST day"
          fi

      - name: Run NSE pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a python -m nse_pipeline.pipeline --date "${{ steps.date.outputs.run_date }}"

      - name: Validate generated snapshot
        run: |
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          ls -lah "output/${RUN_DATE}/"
          python -m nse_pipeline.validate_output --date "${RUN_DATE}"

      - name: Publish daily snapshot to main only
        env:
          RUN_DATE: ${{ steps.date.outputs.run_date }}
        run: |
          STATUS=$(python -c "import json; print(json.load(open('output/${RUN_DATE}/meta.json', encoding='utf-8-sig')).get('status', 'unknown'))")
          echo "Snapshot status: ${STATUS}"

          if [ "${STATUS}" != "success" ]; then
            echo "Snapshot is not publishable (${STATUS}). Nothing will be committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/${RUN_DATE}/"

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "Daily NSE scan: ${RUN_DATE}"
          git push origin HEAD:main
