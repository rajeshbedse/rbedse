name: Daily NSE Scan

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Run date (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string
  schedule:
    - cron: "0 */2 * * 1-6"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: daily-nse-scan
  cancel-in-progress: false

jobs:
  generate-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements-pipeline.txt

      - name: Install Chromium and virtual display
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Determine run date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.run_date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "run_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "run_date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run NSE pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python -m nse_pipeline.pipeline --date "${{ steps.date.outputs.run_date }}"

      - name: Validate generated snapshot
        run: |
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          ls -lah "output/${RUN_DATE}/"
          python -m nse_pipeline.validate_output --date "${RUN_DATE}"
          test -s "output/${RUN_DATE}/ryb_scan.csv"
          python - <<'PY'
          import csv, json, os
          run_date = os.environ["RUN_DATE"]
          base = os.path.join("output", run_date)
          with open(os.path.join(base, "meta.json"), encoding="utf-8-sig") as f:
              meta = json.load(f)
          with open(os.path.join(base, "ryb_scan.csv"), encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          expected = int(meta.get("shortlisted", -1))
          if expected <= 0 or len(rows) != expected:
              raise SystemExit(f"RYB canonical scan mismatch: meta shortlisted={expected}, ryb_scan rows={len(rows)}")
          symbols = [r.get("Symbol", "").strip().upper() for r in rows]
          if not all(symbols) or len(symbols) != len(set(symbols)):
              raise SystemExit("RYB canonical scan contains blank or duplicate symbols")
          print(f"RYB canonical scan validated: {len(rows)} final shortlisted symbols")
          PY
        env:
          RUN_DATE: ${{ steps.date.outputs.run_date }}

      - name: Publish research data to RYB
        env:
          RUN_DATE: ${{ steps.date.outputs.run_date }}
          RYB_REPO_TOKEN: ${{ secrets.RYB_REPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "${RYB_REPO_TOKEN}" ]; then
            echo "RYB_REPO_TOKEN is not configured; skipping RYB publish."
            exit 0
          fi
          STATUS=$(python -c "import json; print(json.load(open('output/${RUN_DATE}/meta.json', encoding='utf-8-sig')).get('status', 'unknown'))")
          if [ "${STATUS}" != "success" ]; then
            echo "Snapshot is not publishable (${STATUS}); skipping RYB publish."
            exit 0
          fi
          rm -rf /tmp/RYB
          git clone --depth 1 "https://x-access-token:${RYB_REPO_TOKEN}@github.com/rajeshbedse/RYB.git" /tmp/RYB
          cd /tmp/RYB
          python scripts/build_snapshot.py "${GITHUB_WORKSPACE}/output/${RUN_DATE}"
          python scripts/validate_snapshot.py
          test -s data/snapshot.json
          test -d data/stocks
          test -d data/history
          CORE_COUNT=$(find data/stocks -maxdepth 1 -name '*.json' | wc -l)
          HISTORY_COUNT=$(find data/history -maxdepth 1 -name '*.json' | wc -l)
          test "${CORE_COUNT}" -gt 0
          test "${CORE_COUNT}" -eq "${HISTORY_COUNT}"
          test ! -e data/stock_details.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "RYB research data is unchanged."
            exit 0
          fi
          git commit -m "Publish research data: ${RUN_DATE}"
          git push origin HEAD:main

      - name: Publish daily snapshot to main only
        env:
          RUN_DATE: ${{ steps.date.outputs.run_date }}
        run: |
          STATUS=$(python -c "import json; print(json.load(open('output/${RUN_DATE}/meta.json', encoding='utf-8-sig')).get('status', 'unknown'))")
          echo "Snapshot status: ${STATUS}"
          if [ "${STATUS}" != "success" ]; then
            echo "Snapshot is not publishable (${STATUS}). Nothing will be committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/${RUN_DATE}/"
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Daily NSE scan: ${RUN_DATE}"
          git push origin HEAD:main
