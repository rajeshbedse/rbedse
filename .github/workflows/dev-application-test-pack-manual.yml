name: DEV Application Test Pack (Manual)

on:
  workflow_dispatch:

# Manual DEV verification only. This workflow tests dev-latest/Render DEV and
# never deploys or modifies main.
permissions:
  contents: read

env:
  RYB_DEV_URL: https://ryb-finserv-dev.onrender.com

jobs:
  test-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout DEV branch
        uses: actions/checkout@v4
        with:
          ref: dev-latest
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install DEV test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Resolve DEV commit under test
        id: dev_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run DEV application test pack
        env:
          EXPECTED_COMMIT: ${{ steps.dev_commit.outputs.sha }}
        run: |
          mkdir -p test-results
          set +e
          python tests/dev_app_smoke.py --expected-commit "$EXPECTED_COMMIT" 2>&1 | tee test-results/smoke.log
          status=${PIPESTATUS[0]}
          echo "$status" > test-results/exit-code.txt
          exit "$status"

      - name: Build DEV evidence report
        if: always()
        env:
          EXPECTED_COMMIT: ${{ steps.dev_commit.outputs.sha }}
        run: python tests/build_dev_test_report.py

      - name: Upload DEV test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-test-evidence-manual
          path: test-results/
          if-no-files-found: error
          retention-days: 30
