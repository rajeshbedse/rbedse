name: DEV Application Tests

on:
  push:
    branches:
      - dev-latest
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Commit expected on DEV Render (leave blank for current branch HEAD)"
        required: false
        type: string

# DEV-only application verification. This workflow never deploys or modifies main.
permissions:
  contents: read

concurrency:
  group: dev-application-tests
  cancel-in-progress: true

env:
  RYB_DEV_URL: https://ryb-finserv-dev.onrender.com

jobs:
  test-dev:
    if: github.ref == 'refs/heads/dev-latest' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout DEV branch
        uses: actions/checkout@v6
        with:
          ref: dev-latest
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install DEV test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run promoter timing unit tests
        run: python -m unittest tests.test_promoter_history

      - name: Run timing integration tests
        run: python -m unittest tests.test_timing_integration

      - name: Validate scan JavaScript syntax
        run: node --check portal/static/js/scan.js

      - name: Probe DEV scan summary API
        run: |
          python - <<'PY'
          import re, requests, time
          base = "https://ryb-finserv-dev.onrender.com"
          s = requests.Session()
          s.headers["User-Agent"] = "RYB-Finserv-DEV-Diagnostic/1.0"
          home = s.get(base + "/", timeout=30)
          home.raise_for_status()
          match = re.search(r'href=["\'](/scan/[0-9]{4}-[0-9]{2}-[0-9]{2})["\']', home.text)
          if not match:
              raise SystemExit("Could not find latest scan URL")
          path = match.group(1)
          url = base + f"/api/scan/{path.rsplit('/', 1)[-1]}/summary?view=shortlist"
          started = time.monotonic()
          response = s.get(url, timeout=60)
          elapsed = time.monotonic() - started
          print(f"DEV summary probe: status={response.status_code} elapsed={elapsed:.2f}s bytes={len(response.content)} url={url}")
          response.raise_for_status()
          data = response.json()
          print(f"DEV summary probe: rows={len(data.get('rows', []))}")
          PY

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run single-stock UI regression
        continue-on-error: true
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
        run: python tests/stock_detail_regression.py --expected-commit "$EXPECTED_COMMIT"

      - name: Diagnose DEV scan page JavaScript
        if: always()
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright
          base = "https://ryb-finserv-dev.onrender.com"
          import requests
          home = requests.get(base + "/", timeout=30).text
          m = re.search(r'href=["\'](/scan/[0-9]{4}-[0-9]{2}-[0-9]{2})["\']', home)
          if not m:
              raise SystemExit("No scan URL found")
          url = urljoin(base, m.group(1))
          console_errors=[]; page_errors=[]; failed=[]
          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              page=browser.new_page(viewport={"width":1440,"height":900})
              page.on("console", lambda msg: console_errors.append(msg.text) if msg.type == "error" else None)
              page.on("pageerror", lambda exc: page_errors.append(str(exc)))
              page.on("requestfailed", lambda req: failed.append(f"{req.method} {req.url}: {req.failure}"))
              page.goto(url, wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(5000)
              print("DIAG scan URL:", url)
              print("DIAG scan-loading hidden:", page.locator("#scan-loading").get_attribute("hidden"))
              print("DIAG result-count:", page.locator("#result-count").inner_text())
              print("DIAG stock-card count:", page.locator("#stock-cards [data-stock]").count())
              print("DIAG console errors:", console_errors or "NONE")
              print("DIAG page errors:", page_errors or "NONE")
              print("DIAG failed requests:", failed or "NONE")
              print("DIAG script sources:", page.locator("script[src]").evaluate_all("els => els.map(e => e.src)"))
              print("DIAG scan.js loaded:", page.evaluate("Array.from(document.scripts).some(s => s.src.includes('/static/js/scan.js'))"))
              browser.close()
          PY

      - name: Run DEV application checks
        if: ${{ success() }}
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
        run: |
          mkdir -p test-results
          set +e
          python tests/dev_app_smoke.py --expected-commit "$EXPECTED_COMMIT" 2>&1 | tee test-results/smoke.log
          status=${PIPESTATUS[0]}
          echo "$status" > test-results/exit-code.txt
          exit "$status"

      - name: Build DEV evidence report
        if: always()
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
        run: python tests/build_dev_test_report.py

      - name: Upload DEV test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dev-test-evidence
          path: test-results/
          if-no-files-found: error
          retention-days: 30
