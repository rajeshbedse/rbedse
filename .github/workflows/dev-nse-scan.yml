name: DEV NSE Scan

on:
  workflow_dispatch:
    inputs:
      data_mode:
        description: "Choose whether to reuse existing data or run a fresh NSE scrape"
        required: true
        default: reuse_existing
        type: choice
        options:
          - reuse_existing
          - refresh_nse
      run_date:
        description: "Snapshot date (YYYY-MM-DD). In reuse mode, blank = latest available snapshot."
        required: false
        type: string
  schedule:
    # Same schedule as Daily NSE Scan: 20:30 IST, Monday-Saturday — generate today's report
    - cron: "30 20 * * 1-6"
      timezone: "Asia/Kolkata"
    # Same schedule as Daily NSE Scan: 08:00 IST, Tuesday-Saturday — refresh previous day's report
    - cron: "0 8 * * 2-6"
      timezone: "Asia/Kolkata"

# DEV-only workflow. It runs only from dev-latest and never targets main.
permissions:
  contents: write

concurrency:
  group: dev-nse-scan
  cancel-in-progress: false

jobs:
  generate-data:
    if: github.ref == 'refs/heads/dev-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout DEV branch
        uses: actions/checkout@v6
        with:
          ref: dev-latest
          fetch-depth: 0

      - name: Set up Python
        if: inputs.data_mode == 'refresh_nse' || github.event_name == 'schedule'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        if: inputs.data_mode == 'refresh_nse' || github.event_name == 'schedule'
        run: python -m pip install -r requirements-pipeline.txt

      - name: Install Chromium and virtual display
        if: inputs.data_mode == 'refresh_nse' || github.event_name == 'schedule'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Determine run date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.run_date }}
          DATA_MODE: ${{ inputs.data_mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "run_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
            echo "Run mode: manual"
            echo "Report date: $INPUT_DATE"
          elif [ "$SCHEDULE" = "0 8 * * 2-6" ]; then
            echo "run_date=$(TZ=Asia/Kolkata date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
            echo "Run mode: morning refresh"
            echo "Report date: previous IST day"
          else
            echo "run_date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
            echo "Run mode: evening scan"
            echo "Report date: current IST day"
          fi

      - name: Run DEV NSE pipeline
        if: inputs.data_mode == 'refresh_nse' || github.event_name == 'schedule'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a python -m nse_pipeline.pipeline --date "${{ steps.date.outputs.run_date }}"

      - name: Build promoter transaction history
        if: inputs.data_mode == 'refresh_nse' || github.event_name == 'schedule'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m nse_pipeline.promoter_history --date "${{ steps.date.outputs.run_date }}"

      - name: Enforce promoter timing output
        if: inputs.data_mode == 'refresh_nse' || github.event_name == 'schedule'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m nse_pipeline.ensure_timing --date "${{ steps.date.outputs.run_date }}"

      - name: Validate generated snapshot
        if: inputs.data_mode == 'refresh_nse' || github.event_name == 'schedule'
        run: |
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          ls -lah "output/${RUN_DATE}/"
          python -m nse_pipeline.validate_output --date "${RUN_DATE}"

      - name: Check existing snapshot
        if: inputs.data_mode == 'reuse_existing' && github.event_name != 'schedule'
        run: |
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          echo "Reusing existing DEV snapshot: ${RUN_DATE}"
          test -f "output/${RUN_DATE}/enriched_analysis.xlsx" || test -f "output/${RUN_DATE}/enriched_full.csv"
          ls -lah "output/${RUN_DATE}/"
          echo "Existing snapshot is available; no NSE scraping or pipeline execution was performed."

      - name: Publish DEV snapshot to DEV branch only
        if: inputs.data_mode == 'refresh_nse' || github.event_name == 'schedule'
        env:
          RUN_DATE: ${{ steps.date.outputs.run_date }}
        run: |
          STATUS=$(python -c "import json; print(json.load(open('output/${RUN_DATE}/meta.json', encoding='utf-8-sig')).get('status', 'unknown'))")
          echo "Snapshot status: ${STATUS}"

          if [ "${STATUS}" != "success" ]; then
            echo "Snapshot is not publishable (${STATUS}). Nothing will be committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/${RUN_DATE}/"

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "DEV NSE scan: ${RUN_DATE}"
          git push origin HEAD:dev-latest
