name: DEV NSE Scan

on:
  workflow_dispatch:
    inputs:
      data_mode:
        description: "Choose whether to reuse existing data or run a fresh NSE scrape"
        required: true
        default: reuse_existing
        type: choice
        options:
          - reuse_existing
          - refresh_nse
      run_date:
        description: "Snapshot date (YYYY-MM-DD). In reuse mode, blank = latest available snapshot."
        required: false
        type: string

# DEV-only workflow. It runs only from dev-latest and never targets main.
permissions:
  contents: write

concurrency:
  group: dev-nse-scan
  cancel-in-progress: false

jobs:
  generate-data:
    if: github.ref == 'refs/heads/dev-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout DEV branch
        uses: actions/checkout@v6
        with:
          ref: dev-latest
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements-pipeline.txt

      - name: Install Chromium and virtual display
        if: inputs.data_mode == 'refresh_nse'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Determine run date
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.run_date }}
          DATA_MODE: ${{ inputs.data_mode }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "run_date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
            echo "Report date: $INPUT_DATE"
          elif [ "$DATA_MODE" = "reuse_existing" ]; then
            RUN_DATE=$(find output -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null \
              | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
              | sort -r \
              | while read -r d; do
                  if [ -f "output/$d/enriched_analysis.xlsx" ] || [ -f "output/$d/enriched_full.csv" ]; then
                    echo "$d"
                    break
                  fi
                done)
            if [ -z "$RUN_DATE" ]; then
              echo "No existing scan snapshot is available in output/."
              exit 1
            fi
            echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
            echo "Reusing existing snapshot: $RUN_DATE"
          else
            echo "run_date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
            echo "Fresh NSE run date: $(TZ=Asia/Kolkata date +%F)"
          fi

      - name: Run DEV NSE pipeline
        if: inputs.data_mode == 'refresh_nse'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a python -m nse_pipeline.pipeline --date "${{ steps.date.outputs.run_date }}"

      - name: Build promoter transaction history
        if: inputs.data_mode == 'refresh_nse'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m nse_pipeline.promoter_history --date "${{ steps.date.outputs.run_date }}"

      - name: Enforce promoter timing output
        if: inputs.data_mode == 'refresh_nse'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m nse_pipeline.ensure_timing --date "${{ steps.date.outputs.run_date }}"

      - name: Validate selected snapshot
        run: |
          RUN_DATE="${{ steps.date.outputs.run_date }}"
          echo "Data mode: ${{ inputs.data_mode }}"
          ls -lah "output/${RUN_DATE}/"
          python -m nse_pipeline.validate_output --date "${RUN_DATE}"

      - name: Publish DEV snapshot to DEV branch only
        if: inputs.data_mode == 'refresh_nse'
        env:
          RUN_DATE: ${{ steps.date.outputs.run_date }}
        run: |
          STATUS=$(python -c "import json; print(json.load(open('output/${RUN_DATE}/meta.json', encoding='utf-8-sig')).get('status', 'unknown'))")
          echo "Snapshot status: ${STATUS}"

          if [ "${STATUS}" != "success" ]; then
            echo "Snapshot is not publishable (${STATUS}). Nothing will be committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "output/${RUN_DATE}/"

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "DEV NSE scan: ${RUN_DATE}"
          git push origin HEAD:dev-latest

      - name: Reuse-mode summary
        if: inputs.data_mode == 'reuse_existing'
        run: |
          echo "Existing DEV snapshot validated; no NSE scraping was performed."
          echo "No output files were modified or committed."
