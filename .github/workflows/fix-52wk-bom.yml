name: Fix NSE 52-week BOM

on:
  push:
    branches: [fix-52wk-api]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nse_pipeline/analyzer.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('if lines and lines[0].lstrip().startswith("Disclaimer -"):', 'if lines and lines[0].lstrip("\\ufeff").lstrip().startswith("Disclaimer -"):')
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile nse_pipeline/analyzer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nse_pipeline/analyzer.py
          git commit -m "fix: handle BOM in NSE 52-week report"
          git push
