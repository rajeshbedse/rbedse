name: Fix final NSE 52-week parser

on:
  push:
    branches: [fix-52wk-api]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nse_pipeline/analyzer.py')
          s=p.read_text(encoding='utf-8')
          old='''    lines = text.splitlines()\n    if lines and lines[0].lstrip("\\ufeff").lstrip().startswith("Disclaimer -"):\n        lines = lines[1:]\n    rows = _csv.DictReader(lines)'''
          new='''    lines = text.splitlines()\n    header_idx = next((i for i, line in enumerate(lines) if "Adjusted_52_Week_High" in line), None)\n    if header_idx is None:\n        return {}\n    rows = _csv.DictReader(lines[header_idx:])'''
          if old not in s: raise SystemExit('expected parser block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile nse_pipeline/analyzer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nse_pipeline/analyzer.py
          git commit -m "fix: parse NSE 52-week report header correctly"
          git push
