name: Fix NSE 52-week report header

on:
  push:
    branches: [fix-52wk-api]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nse_pipeline/analyzer.py')
          s=p.read_text(encoding='utf-8')
          old='''def _parse_52_week_rows(text: str) -> dict[str, dict[str, float | None]]:\n    rows = _csv.DictReader(text.splitlines())'''
          new='''def _parse_52_week_rows(text: str) -> dict[str, dict[str, float | None]]:\n    lines = text.splitlines()\n    if lines and lines[0].lstrip().startswith("Disclaimer -"):\n        lines = lines[1:]\n    rows = _csv.DictReader(lines)'''
          if old not in s: raise SystemExit('parser block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile nse_pipeline/analyzer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nse_pipeline/analyzer.py
          git commit -m "fix: skip NSE 52-week report disclaimer line"
          git push
