name: Validate NSE Sources

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "NSE symbols, comma separated"
        required: true
        default: "APLLTD,GANDHAR"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run NSE validation
        run: |
          IFS=',' read -ra SYMBOLS <<< "${{ inputs.symbols }}"
          python -m nse_pipeline.validate_nse_sources "${SYMBOLS[@]}"

      - name: Upload validation output
        uses: actions/upload-artifact@v4
        with:
          name: nse-validation
          path: output/nse_validation/
          if-no-files-found: error
