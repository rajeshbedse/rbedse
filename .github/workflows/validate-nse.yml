name: Validate NSE Sources

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "NSE symbols, comma separated"
        required: true
        default: "APLLTD,GANDHAR"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas openpyxl

      - name: Run NSE validation
        run: |
          python nse_pipeline/validate_nse_sources.py --symbols "${{ inputs.symbols }}"

      - name: Upload validation output
        uses: actions/upload-artifact@v4
        with:
          name: nse-validation
          path: validation_output/
          if-no-files-found: warn
