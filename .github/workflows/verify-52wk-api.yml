name: Verify NSE 52-week report parsing

on:
  push:
    branches: [fix-52wk-api]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live report and parser
        run: |
          python - <<'PY'
          import requests,csv,io
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json, text/plain, */*','Referer':'https://www.nseindia.com/all-reports'})
          p=s.get('https://www.nseindia.com/api/daily-reports?key=CM',timeout=30); p.raise_for_status(); data=p.json()
          item=next(x for x in data['CurrentDay']+data['PreviousDay'] if x.get('fileKey')=='CM-52 WEEK-HIGH_LOW')
          print('REPORT',item)
          r=s.get(item['filePath']+item['fileActlName'],timeout=30); r.raise_for_status(); print('BYTES',len(r.content))
          lines=r.text.splitlines(); print('DISCLAIMER',lines[0]); rows=list(csv.DictReader(lines[1:] if lines and lines[0].startswith('Disclaimer -') else lines)); print('ROWS',len(rows)); print('COLUMNS',list(rows[0]))
          required={'SYMBOL','Adjusted 52_Week_High','Adjusted 52_Week_Low'}
          missing=required-set(rows[0]); print('MISSING',missing); assert not missing
          for sym in ('RELIANCE','TCS','INFY','HDFCBANK'):
              row=next((x for x in rows if x.get('SYMBOL')==sym),None)
              print('SAMPLE',sym,row)
          print('52-WEEK REPORT PARSING: PASS')
          PY
