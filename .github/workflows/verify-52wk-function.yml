name: Verify 52-week parser function

on:
  push:
    branches: [fix-52wk-api]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute parser
        run: |
          python - <<'PY'
          from nse_pipeline.analyzer import _download_52_week_report
          data = _download_52_week_report()
          assert data, '52-week report returned no rows'
          print('SYMBOL COUNT', len(data))
          for sym in ('RELIANCE','TCS','INFY','HDFCBANK'):
              print(sym, data.get(sym))
          found = [v for v in data.values() if v.get('52WeekHigh') is not None and v.get('52WeekLow') is not None]
          print('POPULATED 52W ROWS', len(found))
          assert found, 'No populated 52-week high/low values found'
          print('52-WEEK PARSER FUNCTION: PASS')
          PY
