name: Verify live NSE 52-week CSV

on:
  push:
    branches: [fix-52wk-api]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current NSE report
        run: |
          python - <<'PY'
          import requests,csv,io
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json, text/plain, */*','Referer':'https://www.nseindia.com/all-reports'})
          p=s.get('https://www.nseindia.com/api/daily-reports?key=CM',timeout=30); p.raise_for_status(); data=p.json()
          item=next(x for x in data['CurrentDay']+data['PreviousDay'] if x.get('fileKey')=='CM-52 WEEK-HIGH_LOW')
          r=s.get(item['filePath']+item['fileActlName'],timeout=30); r.raise_for_status()
          lines=r.text.splitlines(); rows=list(csv.DictReader(lines[1:])); print('REPORT',item); print('COLUMNS',list(rows[0]));
          for sym in ('RELIANCE','TCS','INFY','HDFCBANK'):
              row=next((x for x in rows if x.get('Symbol')==sym or x.get('SYMBOL')==sym),None); print('SAMPLE',sym,row)
          high=[k for k in rows[0] if 'high' in k.lower()]; low=[k for k in rows[0] if 'low' in k.lower()]; print('HIGH_COLS',high); print('LOW_COLS',low); assert high and low
          print('RAW NSE 52-WEEK REPORT: PASS')
          PY
