{% extends "base_legacy.html" %}

{% block head_extra %}
  {{ super() }}
  <style id="global-watermark-layer">
    /* Keep the decorative watermark out of normal document flow. */
    body > svg {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      pointer-events: none !important;
      z-index: 0 !important;
      opacity: .06 !important;
      overflow: visible !important;
    }
    body > .skip-link,
    body > .site-header,
    body > main,
    body > .site-footer {
      position: relative;
      z-index: 1;
    }

    /* Shortlist status colors are translucent, so the watermark remains visible through them. */
    .stock-cards .stock-card.is-shortlisted .stock-card-main,
    .stock-cards .stock-card.is-shortlisted .research-card-main {
      background: rgba(244, 251, 246, .72) !important;
    }
    .stock-cards .stock-card:not(.is-shortlisted) .stock-card-main,
    .stock-cards .stock-card:not(.is-shortlisted) .research-card-main {
      background: rgba(254, 244, 244, .72) !important;
    }
    .stock-cards .stock-card {
      background: transparent !important;
    }

    .stock-modal { z-index: 1000; background: transparent !important; }
    .stock-modal-backdrop { background: #f7f9fc !important; }
    .stock-detail {
      background: transparent !important;
      position: relative !important;
    }
    .stock-detail > .detail-watermark {
      display: block !important;
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      pointer-events: none !important;
      z-index: 0 !important;
    }
    .stock-detail > .detail-watermark > svg {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      pointer-events: none !important;
      opacity: .06 !important;
      overflow: visible !important;
    }
    .stock-detail > :not(.detail-watermark) {
      position: relative;
      z-index: 1;
    }

    /* Match detail-page labels to the scan-result convention: uppercase titles, normal-case values. */
    .stock-modal .stock-detail .market-cell label,
    .stock-modal .stock-detail .activity label,
    .stock-modal .stock-detail .timing label,
    .stock-modal .stock-detail .dd-section,
    .stock-modal .stock-detail .range-values small {
      text-transform: uppercase !important;
      letter-spacing: .035em !important;
    }
    .stock-modal .stock-detail .market-big,
    .stock-modal .stock-detail .activity b,
    .stock-modal .stock-detail .timing b,
    .stock-modal .stock-detail .range-values b {
      text-transform: none !important;
    }

    /* Keep detail-page action/link typography on the same Inter scale as the scan page. */
    .stock-modal .stock-detail .transaction-link,
    .stock-modal .stock-detail .transaction-back-link,
    .stock-modal .stock-detail .view-link {
      font-family: var(--font-sans) !important;
      font-size: var(--text-sm) !important;
      line-height: 1.4 !important;
      font-weight: 700 !important;
    }

    /* Mobile View Analysis typography: bring analysis content back in line with the scan result scale. */
    @media (max-width: 640px) {
      .stock-modal .stock-detail .detail-hero h2 { font-size: 1.8rem !important; }
      .stock-modal .stock-detail .detail-hero p { font-size: .82rem !important; }
      .stock-modal .stock-detail .detail-meta span { font-size: .64rem !important; }
      .stock-modal .stock-detail .detail-score-block .detail-category { font-size: .58rem !important; }
      .stock-modal .stock-detail .detail-score span:first-child { font-size: 2.15rem !important; }
      .stock-modal .stock-detail .dd-head strong { font-size: .82rem !important; }
      .stock-modal .stock-detail .dd-head small { font-size: .64rem !important; }
      .stock-modal .stock-detail .dd-badge { font-size: .64rem !important; }
      .stock-modal .stock-detail .market-big { font-size: 1.08rem !important; }
      .stock-modal .stock-detail .market-cell label,
      .stock-modal .stock-detail .activity label,
      .stock-modal .stock-detail .timing label { font-size: .64rem !important; }
      .stock-modal .stock-detail .market-sub { font-size: .68rem !important; }
      .stock-modal .stock-detail .range-values,
      .stock-modal .stock-detail .range-note { font-size: .62rem !important; }
      .stock-modal .stock-detail .dd-section { font-size: .64rem !important; }
      .stock-modal .stock-detail .activity b { font-size: .78rem !important; }
      .stock-modal .stock-detail .activity .pill { font-size: .52rem !important; }
      .stock-modal .stock-detail .timing b { font-size: .72rem !important; }
      .stock-modal .stock-detail .detail-tab { font-size: .68rem !important; }
      .stock-modal .stock-detail .transaction-link,
      .stock-modal .stock-detail .transaction-back-link { font-size: .78rem !important; }
      .stock-modal .stock-detail .ov-head strong { font-size: .76rem !important; }
      .stock-modal .stock-detail .ov-head small { font-size: .60rem !important; }
      .stock-modal .stock-detail .ov-row { font-size: .66rem !important; }
      .stock-modal .stock-detail .badge { font-size: .66rem !important; }
      .stock-modal .stock-detail .data-note { font-size: .62rem !important; }
    }
  </style>

  <script>
    (function () {
      'use strict';

      var overrideCss = [
        '.stock-modal{background:transparent!important}',
        '.stock-modal-backdrop{background:#f7f9fc!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}',
        '.stock-modal .stock-detail{background:transparent!important;isolation:auto!important;overflow-y:auto!important;overflow-x:hidden!important}',
        '.stock-modal .stock-detail>.detail-watermark{display:block!important;position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;overflow:visible!important;pointer-events:none!important;z-index:0!important}',
        '.stock-modal .stock-detail>.detail-watermark>svg{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;transform:none!important;overflow:visible!important;pointer-events:none!important;opacity:.06!important;z-index:0!important}',
        '.stock-modal .stock-detail>.stock-detail-header{background:rgba(255,255,255,.86)!important}',
        '.stock-modal .stock-detail> :not(.detail-watermark){position:relative;z-index:1}',
        '.stock-modal .stock-detail .detail-tabs{background:rgba(255,255,255,.86)!important}',
        '.stock-modal .stock-detail .detail-score-block{background:transparent!important;background-image:none!important}',
        '.stock-modal .stock-detail .dd-card{background:transparent!important;background-image:none!important}',
        '.stock-modal .stock-detail .dd-card.promoter{background:transparent!important;background-image:none!important}',
        '.stock-modal .stock-detail .activity-grid{background:transparent!important;background-image:none!important}',
        '.stock-modal .stock-detail .activity{background:transparent!important;background-image:none!important}',
        '.stock-modal .stock-detail .overview-card{background:transparent!important;background-image:none!important}'
      ].join('');

      function installAnalysisWatermarkOverride() {
        if (!document.head || !document.getElementById('stock-modal')) return;
        var old = document.getElementById('analysis-watermark-runtime-override');
        if (old) old.remove();
        var style = document.createElement('style');
        style.id = 'analysis-watermark-runtime-override';
        style.textContent = overrideCss;
        document.head.appendChild(style);
      }

      function watchAnalysisStyles() {
        installAnalysisWatermarkOverride();
        if (!document.head) return;
        var observer = new MutationObserver(function (mutations) {
          var changed = mutations.some(function (m) {
            return Array.prototype.some.call(m.addedNodes, function (node) {
              return node !== document.getElementById('analysis-watermark-runtime-override');
            });
          });
          if (!changed) return;
          observer.disconnect();
          installAnalysisWatermarkOverride();
          observer.observe(document.head, { childList: true });
        });
        observer.observe(document.head, { childList: true });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', watchAnalysisStyles, { once: true });
      } else {
        watchAnalysisStyles();
      }
    })();
  </script>

  <script src="{{ url_for('static', filename='js/scan.js') }}?v={{ scan_js_version }}" defer></script>
  <script src="{{ url_for('static', filename='js/stock-detail-dashboard-v2.js') }}?v={{ scan_js_version }}" defer></script>
  <script src="{{ url_for('static', filename='js/scan-layout-fixes.js') }}?v={{ scan_js_version }}" defer></script>
{% endblock %}
