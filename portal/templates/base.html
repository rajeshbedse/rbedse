{% extends "base_legacy.html" %}

{% block head_extra %}
  {{ super() }}
  <style id="global-watermark-layer">
    /* One viewport-anchored watermark shared by every page/state. */
    body > svg[aria-hidden="true"] {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      pointer-events: none !important;
      z-index: 0 !important;
      opacity: .06 !important;
      overflow: visible !important;
    }
    /* The page and modal content must always paint above the watermark. */
    body > .skip-link,
    body > .site-header,
    body > main,
    body > .site-footer {
      position: relative;
      z-index: 1;
    }
    /* Keep the analysis surface transparent so the global watermark remains visible while scrolling. */
    .stock-modal { z-index: 1000; background: transparent !important; }
    .stock-modal-backdrop { background: rgba(15,23,42,.10) !important; }
    .stock-detail { background: transparent !important; }
    .stock-detail-header { background: rgba(255,255,255,.88) !important; }
    /* Do not render a second watermark inside the scrolling stock-detail panel. */
    .detail-watermark { display: none !important; }
  </style>
  <script src="{{ url_for('static', filename='js/scan.js') }}?v={{ scan_js_version }}" defer></script>
  <script src="{{ url_for('static', filename='js/stock-detail-dashboard-v2.js') }}?v={{ scan_js_version }}" defer></script>
  <script src="{{ url_for('static', filename='js/scan-layout-fixes.js') }}?v={{ scan_js_version }}" defer></script>
{% endblock %}
