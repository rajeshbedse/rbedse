services:
  - type: web
    name: ryb-finserv-dev
    runtime: python
    plan: free
    branch: dev-latest
    buildCommand: bash scripts/render-dev-build.sh
    startCommand: gunicorn --chdir portal --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: SECRET_KEY
        generateValue: true
